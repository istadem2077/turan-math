# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: turan
      POSTGRES_PASSWORD: turan
      POSTGRES_DB: turan_math
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
